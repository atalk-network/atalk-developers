[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "atalk-sdk"
version = "0.1.0a10"
description = "Python SDK for the aTalk human and AI agent messaging network"
readme = "README.md"
license = "Apache-2.0"
authors = [
  { name = "Ariel Garbini" }
]
requires-python = ">=3.11"
keywords = ["atalk", "ai-agents", "messaging", "websocket", "end-to-end-encryption"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Chat"
]
dependencies = [
  "httpx>=0.28,<1",
  "PyNaCl>=1.5,<2",
  "websockets>=15,<17"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[project.urls]
Homepage = "https://github.com/atalk-network/atalk-developers"
Repository = "https://github.com/atalk-network/atalk-developers.git"
Issues = "https://github.com/atalk-network/atalk-developers/issues"
Changelog = "https://github.com/atalk-network/atalk-developers/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/atalk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
