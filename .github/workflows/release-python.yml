name: release-python-sdk

on:
  push:
    tags:
      - "python-v*"

permissions:
  contents: read

concurrency:
  group: release-python-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            sdk/python/pyproject.toml
            integrations/hermes/pyproject.toml
      - name: Verify release version
        run: node scripts/verify-release-versions.mjs python "$GITHUB_REF_NAME"
      - name: Require a public publishing repository
        run: |
          visibility=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY" | jq -r '.private')
          test "$visibility" = "false"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build and test
        run: |
          python -m pip install --upgrade build pip-audit twine
          python -m pip_audit sdk/python
          python -m pip install -e 'sdk/python[test]'
          python -m pip install --no-deps -e integrations/hermes
          python -m pytest sdk/python/tests integrations/hermes/tests
          python -m build sdk/python
          python -m build integrations/hermes
          python -m twine check sdk/python/dist/* integrations/hermes/dist/*
      - name: Verify built Python SDK public surface
        run: |
          python -m venv "$RUNNER_TEMP/atalk-wheel-smoke"
          "$RUNNER_TEMP/atalk-wheel-smoke/bin/pip" install sdk/python/dist/*.whl
          "$RUNNER_TEMP/atalk-wheel-smoke/bin/python" - <<'PY'
          import inspect
          from atalk import (
              Agent,
              Message,
              RuntimeManager,
              RuntimeOptions,
              RuntimeUpdateAdvisory,
              WorkroomClient,
          )

          assert "supervision" in inspect.signature(Agent).parameters
          assert inspect.signature(Agent).parameters["token"].default is None
          assert "is_supervisor" in Message.__dataclass_fields__
          assert "routing" in Message.__dataclass_fields__
          assert hasattr(Message, "relay")
          assert hasattr(Message, "mark_read")
          assert hasattr(Agent, "send_with_details")
          assert hasattr(Agent, "send_in_conversation")
          assert hasattr(WorkroomClient, "poll")
          assert hasattr(WorkroomClient, "read_audit_events")
          assert hasattr(WorkroomClient, "publish_mandated")
          assert hasattr(WorkroomClient, "submit_file_mandated")
          assert RuntimeManager is not None
          assert RuntimeOptions is not None
          assert RuntimeUpdateAdvisory is not None
          print("Verified packaged Python direct-message and Task APIs")
          PY
          "$RUNNER_TEMP/atalk-wheel-smoke/bin/pip" install --no-deps integrations/hermes/dist/*.whl
          "$RUNNER_TEMP/atalk-wheel-smoke/bin/python" - <<'PY'
          import importlib.metadata
          import atalk_hermes

          assert importlib.metadata.version("atalk-hermes") == "0.1.0a11"
          assert atalk_hermes.__version__ == "0.1.0a11"
          print("Verified packaged Hermes plugin runtime surface")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-sdk-distributions
          path: sdk/python/dist/
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hermes-plugin-distributions
          path: integrations/hermes/dist/
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/atalk-sdk
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-sdk-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          attestations: true

  publish-hermes:
    needs: [build, publish]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/atalk-hermes
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: hermes-plugin-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          attestations: true

  release:
    name: publish-release-notes
    needs: [publish, publish-hermes]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create canonical release page for the runtime advisory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "aTalk Python runtime ${GITHUB_REF_NAME#python-v}" \
              --generate-notes \
              --verify-tag
