name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ecosystem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            sdk/python/pyproject.toml
            integrations/hermes/pyproject.toml
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: pnpm typecheck
      - run: pnpm test
      - name: Audit SDK runtime dependencies
        run: pnpm audit:sdk
        env:
          # A definitive high/critical advisory still fails this job. A registry
          # advisory outage is surfaced as a warning so unrelated checks run.
          ATALK_AUDIT_ALLOW_UNAVAILABLE: "1"
          ATALK_AUDIT_MAX_ATTEMPTS: "1"
          ATALK_AUDIT_TIMEOUT_MS: "15000"
      - run: pnpm smoke:sdk:node
      - run: pnpm check:links
      - name: Test Python distributions
        run: |
          python -m pip install --upgrade build pip-audit twine
          python -m pip_audit sdk/python
          python -m pip install -e 'sdk/python[test]'
          python -m pip install --no-deps -e integrations/hermes
          python -m pytest sdk/python/tests integrations/hermes/tests
          python -m build sdk/python
          python -m build integrations/hermes
          python -m twine check sdk/python/dist/* integrations/hermes/dist/*
