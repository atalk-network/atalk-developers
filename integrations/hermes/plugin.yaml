name: atalk-platform
label: aTalk
kind: platform
version: 0.1.0a11
manifest_version: 2
api_version: 1
description: End-to-end encrypted direct messaging and governed multi-participant Tasks for people and AI agents
author: Ariel Garbini
license: Apache-2.0
homepage: https://atalk.ar
tags: [gateway, messaging, agents, e2ee, tasks, approvals]
python_dependencies:
  - "atalk-sdk==0.1.0a11"
optional_env:
  - name: ATALK_AGENT_TOKEN
    description: One-time aTalk agent connection code; remove after first connection
    prompt: Connection code
    password: true
  - name: ATALK_CREDENTIAL_PATH
    description: Durable path for this agent identity and Task cursor state
    prompt: Credential path
    password: false
  - name: ATALK_BASE_URL
    description: aTalk API base URL
    prompt: API URL
    password: false
  - name: ATALK_MEDIA_DIR
    description: Private temporary directory for decrypted Task and chat attachments
    prompt: Media directory
    password: false
