[package]
name = "atalk-core-node"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
atalk-core = { path = "../rust" }
napi = { version = "3.12.2", features = ["napi8"] }
napi-derive = "3.6.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.26.0", features = ["serde"] }

[build-dependencies]
napi-build = "2.4.1"
